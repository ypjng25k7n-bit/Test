<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brutto-Netto-Rechner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-animation"></div>

    <div class="container">
        <header>
            <h1>💰 Gehaltsrechner</h1>
            <p class="subtitle">Berechne dein Nettoeinkommen in Sekunden</p>
        </header>

        <main class="calculator">
            <div class="empty-state" id="emptyState">
                <p>👇 Gib dein Bruttogehalt ein und klicke auf "Berechnen"</p>
            </div>

            <div class="input-group">
                <label for="bruttoInput">Bruttogehalt (€)</label>
                <div class="input-wrapper">
                    <span class="currency-symbol">€</span>
                    <input
                        type="number"
                        id="bruttoInput"
                        placeholder="z.B. 2000"
                        min="0"
                        step="100"
                        autofocus
                    >
                </div>
            </div>

            <button id="calculateBtn" class="calculate-btn">
                <span class="btn-text">Berechnen</span>
                <span class="btn-icon">→</span>
            </button>

            <div class="results" id="results" style="display: none;">
                <div class="result-card primary">
                    <div class="result-item">
                        <span class="result-label">Bruttogehalt</span>
                        <span class="result-value" id="resultBrutto">€ 0,00</span>
                    </div>
                </div>

                <div class="result-card netto">
                    <div class="result-item">
                        <span class="result-label">Nettoeinkommen</span>
                        <span class="result-value netto-value" id="resultNetto">€ 0,00</span>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2026 Gehaltsrechner | Schnell & einfach</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
